services:
  dartvision:
    build: .
    container_name: dartvision-api
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./uploads:/app/uploads
      - ./out:/app/out
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dartvision-network

  nginx:
    image: nginx:latest
    container_name: dartvision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - dartvision
    networks:
      - dartvision-network

  certbot:
    image: certbot/certbot:latest
    container_name: dartvision-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - dartvision-network

networks:
  dartvision-network:
    driver: bridge
